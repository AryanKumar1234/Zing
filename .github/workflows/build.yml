name: Extract zips, build and publish APKs

on:
  push:
    branches: [main]
    paths:
      - "**.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Optional: sign with your own key if the secrets exist
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Extract every zip and build its APK
        run: |
          set -e
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/src" dist
          zips=(*.zip */*.zip)
          [ ${#zips[@]} -eq 0 ] && { echo "No zip files found"; exit 1; }
          for z in "${zips[@]}"; do
            name=$(basename "$z" .zip)
            echo "=== $z ==="
            mkdir -p "$RUNNER_TEMP/src/$name"
            unzip -q "$z" -d "$RUNNER_TEMP/src/$name"
            settings=$(find "$RUNNER_TEMP/src/$name" -maxdepth 3 -name "settings.gradle*" | head -n 1)
            [ -z "$settings" ] && { echo "No settings.gradle in $z"; exit 1; }
            dir=$(dirname "$settings")
            (cd "$dir" && gradle assembleRelease --no-daemon)
            cp "$dir/app/build/outputs/apk/release/app-release.apk" "dist/${name}-v1.0.${{ github.run_number }}.apk"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: Zing-apks
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zing v1.0.${{ github.run_number }}
          files: dist/*.apk
          generate_release_notes: true
          
