name: Extract zip, build and publish APK

on:
  push:
    branches: [main]
    paths:
      - "**.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
          mkdir -p "$RUNNER_TEMP/src"
          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/src"
          else
            echo "No zip found, using repo contents"
            cp -r . "$RUNNER_TEMP/src/"
          fi
          SETTINGS=$(find "$RUNNER_TEMP/src" -maxdepth 3 -name "settings.gradle*" | head -n 1)
          [ -z "$SETTINGS" ] && { echo "No settings.gradle found in project"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Optional: sign with your own key if the secrets exist
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "NtfyAlarm-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NtfyAlarm-apk
          path: NtfyAlarm-v1.0.${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ntfy Alarm v1.0.${{ github.run_number }}
          files: NtfyAlarm-v1.0.${{ github.run_number }}.apk
          generate_release_notes: true
          
