name: Build both APKs and publish a release

on:
  push:
    branches: [main]
    paths:
      - "**.zip"
      - "bytello-app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Both apps compile against API 34; install it in case the runner image does not ship it.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "sdkmanager not found; assuming the runner image already has the Android SDK"
          fi

      # Optional: use your own key when the secrets exist.
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # A project is built from its committed folder when one exists (bytello-app/), and from its
      # zip when it does not (zing-control.zip). zing-control signs its own release build; the
      # Bytello project has no signingConfig, so its APK is signed here — Android refuses to
      # install an unsigned APK.
      - name: Build every project
        run: |
          set -euo pipefail
          shopt -s nullglob

          rm -rf dist && mkdir -p dist
          work="$RUNNER_TEMP/src"
          rm -rf "$work" && mkdir -p "$work"

          if [ -n "${KEYSTORE_PATH:-}" ]; then
            sign_ks="$KEYSTORE_PATH"
            sign_pass="${KEYSTORE_PASSWORD:-}"
            sign_alias="${KEY_ALIAS:-}"
            sign_keypass="${KEY_PASSWORD:-}"
          else
            sign_ks="$RUNNER_TEMP/debug.keystore"
            rm -f "$sign_ks"
            keytool -genkeypair -keystore "$sign_ks" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            sign_pass=android
            sign_alias=androiddebugkey
            sign_keypass=android
          fi

          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"

          names=()
          dirs=()

          for z in *.zip */*.zip; do
            name="$(basename "$z" .zip)"
            dest="$work/$name"
            mkdir -p "$dest"
            unzip -q "$z" -d "$dest"
            settings="$(find "$dest" -maxdepth 3 -name 'settings.gradle*' | head -n 1)"
            [ -n "$settings" ] || { echo "No settings.gradle in $z"; exit 1; }
            names+=("$name")
            dirs+=("$(dirname "$settings")")
          done

          for d in */; do
            d="${d%/}"
            case "$d" in .*|work) continue ;; esac
            settings="$(find "$d" -maxdepth 3 -name 'settings.gradle*' | head -n 1)"
            [ -n "$settings" ] || continue
            names+=("$d")
            dirs+=("$(dirname "$settings")")
          done

          [ "${#names[@]}" -ge 1 ] || { echo "Nothing to build"; exit 1; }

          count=0
          for i in "${!names[@]}"; do
            name="${names[$i]}"
            project="${dirs[$i]}"
            echo "::group::Building $name"
            ( cd "$project" && gradle assembleRelease --no-daemon --stacktrace )

            apk_dir="$project/app/build/outputs/apk/release"
            signed_apk="$(find "$apk_dir" -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)"
            unsigned_apk="$(find "$apk_dir" -maxdepth 1 -name '*-unsigned.apk' | head -n 1)"
            apk="${signed_apk:-$unsigned_apk}"
            [ -n "$apk" ] || { echo "No release APK produced for $name"; exit 1; }

            out="dist/${name}-v1.0.${GITHUB_RUN_NUMBER}.apk"
            cp "$apk" "$out"

            if [ -z "$signed_apk" ] && [ -n "$unsigned_apk" ]; then
              echo "Signing $name with $sign_alias (the Gradle release build is unsigned)"
              "$build_tools/apksigner" sign --ks "$sign_ks" --ks-key-alias "$sign_alias" \
                --ks-pass "pass:$sign_pass" --key-pass "pass:$sign_keypass" \
                --out "$out" "$unsigned_apk"
            fi

            "$build_tools/apksigner" verify "$out" > /dev/null \
              || { echo "Signature verification failed for $out"; exit 1; }
            echo "Built $out ($(stat -c%s "$out") bytes)"
            echo "::endgroup::"
            count=$((count + 1))
          done

          [ "$count" -eq 2 ] || { echo "Expected 2 APKs, built $count"; exit 1; }
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: Zing-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zing v1.0.${{ github.run_number }}
          body: |
            Both apps, signed so they install:

            - `bytello-app-*.apk` - Bytlello Service (phone-side listener; set the device name once)
            - `zing-control-*.apk` - Zing controller
          files: dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
